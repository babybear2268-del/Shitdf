name: ðŸ¤– AWS Transform â€” Rewrite Stubs (Orchestrator Pro)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (analyze, no commit)'
        required: false
        default: 'false'
        type: boolean

# Required for OIDC authentication
permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  transform-stubs:
    name: Rewrite Stub Code with AWS Transform
    runs-on: ubuntu-latest

    steps:
      # â”€â”€ 1. Checkout â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ“¥ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # â”€â”€ 2. Java 11 Setup â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: â˜• Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # â”€â”€ 3. Make Gradle Wrapper Executable â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ”“ Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # â”€â”€ 4. Generate Debug Keystore â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ”‘ Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          cp $HOME/.android/debug.keystore ${{ github.workspace }}/debug.keystore || true

      # â”€â”€ 5. Cache Gradle Packages â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ“¦ Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # â”€â”€ 6. Install AWS Transform CLI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ”§ Install AWS Transform CLI
        run: |
          curl -fsSL https://transform-cli.awsstatic.com/install.sh | bash
          echo "$HOME/.atx/bin" >> $GITHUB_PATH

      - name: âœ… Verify ATX installation
        run: atx --version

      # â”€â”€ 7. Configure AWS Credentials via OIDC â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ” Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/OrchestratorProGitHubActionsRole
          role-session-name: OrchestratorProTransform-${{ github.run_number }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      # â”€â”€ 8. Write Expanded Transformation Definition & Prompts â”€â”€â”€â”€â”€â”€
      - name: ðŸ“ Write Orchestrator Pro transformation definition
        run: |
          mkdir -p .atx
          cat > .atx/orchestrator-stub-rewrite.md << 'EOF'
          # Transformation Specification: Orchestrator Pro Stub Refactoring

          ## Executive Objective
          Analyze, refactor, and replace all incomplete stub implementations, placeholder functions, empty lambdas, and simulated networking code across the project. Ensure every component conforms to production-grade Kotlin, Coroutines, Jetpack Compose, OkHttp, and Playwright framework standards.

          ---

          ## Playwright & HMAC Architecture Framework Integration

          When refactoring network components (`RealWebExecutor.kt` or Playwright automation scripts), implement the following dual-mode framework patterns:

          ### 1. Direct HMAC API Request Signing (`APIRequestContext`)
          Use for pure API calls where DOM rendering is not required:
          - **Canonical String:** `${METHOD}\n${PATH_AND_SORTED_QUERY}\n${TIMESTAMP}\n${BODY}`
          - **Query Parameter Sorting:** Sort URL parameters alphabetically prior to hashing to prevent signature mismatches.
          - **HMAC Calculation:** Compute HMAC-SHA256 signature and attach via `X-Timestamp` and `X-Signature` headers.
          - **Clock Skew:** Handle server time offsets dynamically using HTTP `Date` response header comparisons.

          ### 2. Dynamic HMAC Signing via Network Interception (`page.route`)
          Use when DOM rendering is required (client-side state hydration or SPA scraping):
          - Intercept matching API patterns (e.g., `**/api/v2/**`).
          - Compute HMAC-SHA256 signature on the fly using request metadata (`method`, `pathname`, `timestamp`, `postData`).
          - Pass updated headers (`X-HMAC-Signature`, `X-HMAC-Timestamp`) via `route.continue()`.
          - Wait for DOM target selectors (e.g., `.data-card`) before scraping extracted elements.

          ### 3. Anti-Fingerprinting (JA3 / JA4 Compliance)
          - Set custom browser user agents and align standard headers (`User-Agent`, `Referer`, `Accept-Language`, `Sec-Ch-Ua`).
          - Use headful launch args (`--disable-blink-features=AutomationControlled`) when browser rendering is necessary to align TLS ClientHello fingerprints.

          ---

          ## Target File Specifications & Prompts

          ### 1. File: `app/src/main/java/com/example/MainActivity.kt`
          * **Prompt Instruction:**
            Implement a functional Jetpack Compose `ModalNavigationDrawer` controlled by a `DrawerState`. When the top app bar menu button is clicked, open the drawer. Include a drawer header with app metadata ("Orchestrator Pro") and navigation items for "Monitor", "Profiles", "Config", "Logs", and "Settings".

          ### 2. File: `app/src/main/java/com/example/ui/screens/MonitorScreen.kt` (NEW FILE)
          * **Prompt Instruction:**
            Create a complete, production-ready Jetpack Compose Material3 screen named `MonitorScreen`.
            Include:
            - **Header Metrics:** Live summary card displaying active pipeline jobs and system health status.
            - **Job Status List:** LazyColumn listing active jobs with execution status badges (Running, Success, Failed, Retrying).
            - **Action Controls:** "Deploy Pipeline" FAB and item-level "Run Now" and "Cancel" buttons wired to `OrchestratorViewModel`.
            - **Telemetry Log Stream:** Expandable bottom panel showing real-time logs color-coded by severity.

          ### 3. File: `app/src/main/java/com/example/ui/OrchestratorViewModel.kt`
          * **Prompt Instruction:**
            Refactor `retryJob(jobId: String)` to execute an exponential backoff retry mechanism inside `viewModelScope.launch(Dispatchers.IO)`.
            Requirements:
            - Maximum 3 retry attempts.
            - Delay intervals: 2s, 4s, 8s ($2^n \times 1000$ ms).
            - Emit state changes via `_jobState.value` (`JobStatus.Retrying(attempt, maxAttempts)`).
            - Log telemetry messages on each retry attempt.

          ### 4. File: `app/src/main/java/com/example/network/RealWebExecutor.kt`
          * **Prompt Instruction:**
            Rewrite `RealWebExecutor` using production-grade OkHttp3 calls with integrated HMAC signing.
            Requirements:
            - Use `OkHttpClient` with configured timeouts (30s connect, 60s read, 60s write).
            - Implement custom `Interceptor` for HTTP 429 (Too Many Requests) to read `Retry-After` header and execute automated thread-safe retry delays.
            - Calculate HMAC-SHA256 signatures on canonical URLs (with sorted query parameters) and attach `X-HMAC-Timestamp` and `X-HMAC-Signature` headers dynamically.
            - Configure standard browser headers (`User-Agent`, `Accept-Language`, `Sec-Ch-Ua`) to avoid TLS/JA3 fingerprinting mismatches on direct API requests.

          ### 5. Playwright Integration & Hybrid Extraction
          * **Prompt Instruction:**
            Refactor Playwright web automation scripts to support both direct API signing (`APIRequestContext`) and dynamic network route interception (`page.route`).
            If a dynamic secret or CSRF nonce is embedded in page state (`window.__INITIAL_STATE__`), extract it during browser initial load and pass it to the HMAC signing engine before triggering target API endpoints or DOM scraping selectors.

          ### 6. Discord Webhook Logging
          * **Prompt Instruction:**
            Implement a non-blocking POST request sender targeting Discord Webhooks using OkHttp3.
            Requirements:
            - Construct valid JSON payload containing embeds, timestamps, job execution summaries, and status colors.
            - Execute silently in `Dispatchers.IO` using fire-and-forget logic so network errors on webhook delivery do not crash or block primary app flows.

          ### 7. URI Auto-fill & Card Field Validation
          * **Prompt Instruction:**
            Implement auto-fill query parameter parsing from deep-link URIs.
            When parsing credit card, profile, or payment params:
            - Implement a pure Kotlin **Luhn Algorithm** validation function (`fun isValidLuhn(number: String): Boolean`).
            - Validate card length, expiration date format (`MM/YY`), and CVV pattern using regular expressions before auto-filling form state fields.
            - Show UI validation state errors on text input fields if Luhn validation fails.
          EOF

      # â”€â”€ 9. Execute AWS Transform CLI â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸš€ Run AWS Transform stub rewrite
        run: |
          atx custom def exec \
            --transformation-name "orchestrator-stub-rewrite" \
            --transformation-definition-path ".atx/orchestrator-stub-rewrite.md" \
            --code-repository-path "." \
            --build-command "./gradlew assembleDebug --build-cache --parallel --no-daemon" \
            --non-interactive \
            --trust-all-tools

      # â”€â”€ 10. Verify Debug Build Compiles â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ—ï¸ Build debug APK
        run: gradle assembleDebug --stacktrace

      # â”€â”€ 11. Run Unit Tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ§ª Run unit tests
        run: gradle testDebugUnitTest || true

      # â”€â”€ 12. Upload Test Reports Artifact â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ“Š Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      # â”€â”€ 13. Upload Debug APK Artifact â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ“± Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-pro-transformed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # â”€â”€ 14. Commit & Push Branch â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ’¾ Commit transformed code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "aws-transform-bot"
          git config user.email "aws-transform-bot@users.noreply.github.com"
          
          BRANCH_NAME="transform/stub-rewrite-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected following transformation execution."
          else
            git commit -m "feat: rewrite stubs to production code via AWS Transform

            Run: ${{ github.run_number }} | $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "$BRANCH_NAME"
          fi

      # â”€â”€ 15. Create Pull Request â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ”€ Create Pull Request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: transform/stub-rewrite-${{ github.run_number }}
          title: "ðŸ¤– AWS Transform: Rewrite stubs â†’ production code (Run #${{ github.run_number }})"
          body: |
            ## ðŸ¤– Automated Stub Rewrite â€” Orchestrator Pro

            Generated by **AWS Transform Custom** (`atx`). Review the refactored code before merging into `main`.

            ### âœ… Refactoring Highlights
            - **Playwright & HMAC Framework:** Implemented direct `APIRequestContext` signing, dynamic `page.route()` interception, and hybrid DOM secret extraction.
            - **`MainActivity.kt`:** Added functional Material3 `ModalNavigationDrawer` with application metadata.
            - **`MonitorScreen.kt`:** Generated missing Jetpack Compose screen with job counters, dynamic lists, and telemetry logging.
            - **`OrchestratorViewModel.kt`:** Implemented exponential backoff retry mechanism ($2^n \times 1000\text{ ms}$).
            - **`RealWebExecutor.kt`:** Converted to suspending OkHttp3 network calls with HTTP 429 retry handling, dynamic HMAC signatures, and browser-aligned HTTP headers.
            - **Discord Webhook:** Hardened async HTTP logger under `Dispatchers.IO`.
            - **Config & URI Logic:** Integrated auto-fill parser and Luhn algorithm credit card validation.

            ### ðŸ‘€ Review & QA Checklist
            - [ ] Verify navigation drawer behavior in emulator
            - [ ] Run retry logic against a failing test pipeline job
            - [ ] Confirm OkHttp/Playwright endpoints and HMAC headers align with API specs
            - [ ] Test Luhn validation logic against test card numbers
          labels: |
            aws-transform
            automated
            stub-rewrite
