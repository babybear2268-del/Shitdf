name: AWS Deploy & Code Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  configure-aws:
    name: Configure AWS Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          aws-region: us-east-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

  codeguru-scan:
    name: CodeGuru Security & Quality Scan
    runs-on: ubuntu-latest
    needs: configure-aws
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          aws-region: us-east-2

      - name: Amazon CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          s3_bucket: codeguru-reviewer-228060739480-us-east-2

      - name: Upload CodeGuru Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: codeguru-results.sarif.json

  deploy:
    name: Deploy App to S3
    runs-on: ubuntu-latest
    needs: codeguru-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          aws-region: us-east-2

      - name: Sync app folder to S3
        run: |
          aws s3 sync ./app s3://app1939484/ \
            --delete \
            --region us-east-2

      - name: Verify S3 Deployment
        run: |
          echo "✅ Deployment complete. Files in bucket:"
          aws s3 ls s3://app1939484/ --recursive --human-readable
