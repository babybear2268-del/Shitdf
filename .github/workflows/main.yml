name: AWS CodeGuru Reviewer and S3 Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions required to request the OIDC JWT token from AWS STS
permissions:
  id-token: write
  contents: read

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the source code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CodeGuru requires full history for differential reviews

      # Step 2: Authenticate with AWS via OIDC Token Exchange
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-codeguru-role
          aws-region: us-east-2 # Matching your CodeGuru reviewer bucket region

      # Step 3: Run CodeGuru Reviewer Action
      - name: AWS CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          build_path: . # Root path of repository or build artifacts
          s3_bucket: codeguru-reviewer-228060739480-us-east-2

      # Step 4: Verify S3 Upload Permissions (Optional Verification Step)
      - name: Verify Application S3 Bucket Access
        run: |
          echo "Verifying bucket access..."
          aws s3 list-objects --bucket app1939484
