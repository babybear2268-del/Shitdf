name: AWS Transform - Rewrite Stubs (Orchestrator Pro)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (analyze, no commit)'
        required: false
        default: 'false'
        type: boolean

# Required for OIDC authentication
permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  transform-stubs:
    name: Rewrite Stub Code with AWS Transform
    runs-on: ubuntu-latest

    steps:
      # -- 1. Checkout ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -- 2. Java 11 Setup -------------------------------------------
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # -- 3. Generate Gradle Wrapper (if missing) -------------------
      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found. Generating wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      # -- 4. Generate Debug Keystore ---------------------------------
      - name: Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          cp $HOME/.android/debug.keystore ${{ github.workspace }}/debug.keystore

      # -- 5. Cache Gradle Packages -----------------------------------
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 6. AWS credentials (OIDC — no long-lived keys) ─────────────
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          role-session-name: OrchestratorProTransform-${{ github.run_number }}
          aws-region: us-east-1
          role-duration-seconds: 3600
                # ── 7. Write transformation definition ────────────────────────
      - name: 📝 Write Orchestrator Pro transformation definition
        run: |
          mkdir -p .atx
          cat > .atx/orchestrator-stub-rewrite.md << 'EOF'
          additionalPlanContext=This is an Android Kotlin Jetpack Compose MVVM app.
          Find and rewrite all stub and placeholder implementations with production-grade Kotlin code.
          Fix: empty onMenuClick lambda, missing MonitorScreen.kt, retryJob() exponential backoff,
          RealWebExecutor OkHttp3 HTTP calls, remove Playwright references, harden Discord webhook,
          URI auto-fill with Luhn validation.
          Tech stack: Kotlin, Compose, Material3, Room, StateFlow, OkHttp3, Moshi, Gradle KTS, Java 11,
          minSdk 23, targetSdk 36. Use only existing dependencies from libs.versions.toml.
          EOF

      # ── 8. Run AWS Transform ───────────────────────────────────────
      - name: 🚀 Run AWS Transform stub rewrite
        run: |
          atx custom def exec \
            -n "orchestrator-stub-rewrite" \
            -p "." \
            -c "./gradlew assembleDebug --build-cache --parallel --no-daemon" \
            -g "$(cat .atx/orchestrator-stub-rewrite.md)" \
            -x \
            -t


      # -- 9. Execute AWS Transform CLI ------------------------------
      - name: Run AWS Transform stub rewrite
        run: |
          atx custom def exec \
            --transformation-name "orchestrator-stub-rewrite" \
            --transformation-definition-path ".atx/orchestrator-stub-rewrite.md" \
            --code-repository-path "." \
            --build-command "./gradlew assembleDebug --build-cache --parallel --no-daemon" \
            --non-interactive \
            --trust-all-tools

      # -- 10. Verify Debug Build Compiles ---------------------------
      - name: Build debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --no-daemon

      # -- 11. Run Unit Tests ----------------------------------------
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      # -- 12. Upload Test Reports Artifact --------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      # -- 13. Upload Debug APK Artifact -----------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-pro-transformed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # -- 14. Commit & Push Branch -----------------------------------
      - name: Commit transformed code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "aws-transform-bot"
          git config user.email "aws-transform-bot@users.noreply.github.com"
          
          BRANCH_NAME="transform/stub-rewrite-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected following transformation execution."
          else
            git commit -m "feat: rewrite stubs to production code via AWS Transform

            Run: ${{ github.run_number }} | $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "$BRANCH_NAME"
          fi

      # -- 15. Create Pull Request ------------------------------------
      - name: Create Pull Request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: transform/stub-rewrite-${{ github.run_number }}
          title: "AWS Transform: Rewrite stubs -> production code (Run #${{ github.run_number }})"
          body: |
            ## Automated Stub Rewrite - Orchestrator Pro

            Generated by **AWS Transform Custom** (`atx`). Review the refactored code before merging into `main`.

            ### Refactoring Highlights
            - **Playwright & HMAC Framework:** Implemented direct `APIRequestContext` signing, dynamic `page.route()` interception, and hybrid DOM secret extraction.
            - **`MainActivity.kt`:** Added functional Material3 `ModalNavigationDrawer` with application metadata.
            - **`MonitorScreen.kt`:** Generated missing Jetpack Compose screen with job counters, dynamic lists, and telemetry logging.
            - **`OrchestratorViewModel.kt`:** Implemented exponential backoff retry mechanism ($2^n \times 1000$ ms).
            - **`RealWebExecutor.kt`:** Converted to suspending OkHttp3 network calls with HTTP 429 retry handling, dynamic HMAC signatures, and browser-aligned HTTP headers.
            - **Discord Webhook:** Hardened async HTTP logger under `Dispatchers.IO`.
            - **Config & URI Logic:** Integrated auto-fill parser and Luhn algorithm credit card validation.

            ### Review & QA Checklist
            - [ ] Verify navigation drawer behavior in emulator
            - [ ] Run retry logic against a failing test pipeline job
            - [ ] Confirm OkHttp/Playwright endpoints and HMAC headers align with API specs
            - [ ] Test Luhn validation logic against test card numbers
          labels: |
            aws-transform
            automated
            stub-rewrite
