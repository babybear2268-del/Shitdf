name: 🤖 AWS Transform — Rewrite Stubs (Orchestrator Pro)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (analyze, no commit)'
        required: false
        default: 'false'
        type: boolean

# Required for OIDC token generation
permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  transform-stubs:
    name: Rewrite Stub Code with AWS Transform
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Java 11 ────────────────────────────────────────────────
      - name: ☕ Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # ── 3. Node.js 22 (required by ATX CLI) ──────────────────────
      - name: 📦 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 4. Install AWS Transform CLI ──────────────────────────────
      - name: 🔧 Install AWS Transform CLI
        run: |
          curl -fsSL https://transform-cli.awsstatic.com/install.sh | bash
          echo "$HOME/.atx/bin" >> $GITHUB_PATH

      - name: ✅ Verify ATX installation
        run: atx --version

      # ── 5. Gradle cache ───────────────────────────────────────────
      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # ── 6. Set up Gradle ──────────────────────────────────────────
      - name: 🔧 Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ── 7. Ensure gradlew exists and is executable ────────────────
      - name: 🔑 Ensure gradlew exists and is executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found — generating wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      # ── 8. Generate debug keystore ────────────────────────────────
      - name: 🔑 Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

            # ── 9. AWS credentials via OIDC (no long-lived keys) ──────────
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          role-session-name: OrchestratorProTransform-${{ github.run_number }}
          aws-region: us-east-1
          role-duration-seconds: 3600

✅ What Was Wrong vs Fixed

      # ── 10. Write transformation config ───────────────────────────
      - name: 📝 Write transformation config
        run: |
          mkdir -p .atx
          cat > .atx/config.json << 'EOF'
          {
            "transformationName": "orchestrator-stub-rewrite",
            "buildCommand": "./gradlew assembleDebug --build-cache --parallel --no-daemon",
            "additionalPlanContext": "Android Kotlin Jetpack Compose MVVM app. Rewrite all stub and placeholder implementations with production-grade Kotlin code. Fix: (1) empty onMenuClick lambda in MainActivity.kt — implement ModalNavigationDrawer with app version, about dialog, settings nav. (2) Missing MonitorScreen.kt — create full Compose screen with job status list, telemetry preview, deploy and pipeline run buttons. (3) retryJob() in OrchestratorViewModel.kt — exponential backoff max 3 attempts, delays 2s/4s/8s, StateFlow status updates, telemetry logging. (4) RealWebExecutor HTTP stubs — OkHttp3 suspending calls, 30s connect / 60s read timeouts, HTTP 429 backoff. (5) Remove all Playwright references, replace with Kotlin string/regex HTML parsing. (6) Discord webhook — OkHttp3 POST with viewModelScope, silent failure handling. (7) URI auto-fill — robust query param parsing with Luhn algorithm card validation. Tech stack: Kotlin, Jetpack Compose, Material3, MVVM, StateFlow, Room, OkHttp3, Retrofit, Moshi, Kotlin Coroutines, viewModelScope. Gradle KTS, Java 11, minSdk 23, targetSdk 36. Do NOT add new dependencies — use only libs already in libs.versions.toml."
          }
          EOF

      # ── 11. Run AWS Transform ─────────────────────────────────────
      - name: 🚀 Run AWS Transform stub rewrite
        env:
          ATX_SERVICE_PROFILE_ARN: arn:aws:transform:us-east-1:228060739480:profile/XXE73CNGP3G4
          ATX_TENANT_ID: 7223606c1e23777de
        run: |
          atx custom def exec \
            -p "." \
            -c "./gradlew assembleDebug --build-cache --parallel --no-daemon" \
            -g "file://.atx/config.json" \
            -x \
            -t

      # ── 12. Build debug APK ───────────────────────────────────────
      - name: 🏗️ Build debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --no-daemon

      # ── 13. Run unit tests ────────────────────────────────────────
      - name: 🧪 Run unit tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      # ── 14. Upload test results ───────────────────────────────────
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/

      # ── 15. Upload debug APK ──────────────────────────────────────
      - name: 📱 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-pro-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # ── 16. Commit transformed code to new branch ─────────────────
      - name: 💾 Commit transformed code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "aws-transform-bot"
          git config user.email "aws-transform-bot@users.noreply.github.com"
          git checkout -b transform/stub-rewrite-${{ github.run_number }}
          git add -A
          git diff --staged --quiet || git commit -m "feat: rewrite stubs to production code via AWS Transform

          Run: ${{ github.run_number }} | $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin transform/stub-rewrite-${{ github.run_number }}

      # ── 17. Open Pull Request ─────────────────────────────────────
      - name: 🔀 Create Pull Request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: transform/stub-rewrite-${{ github.run_number }}
          title: "🤖 AWS Transform: Rewrite stubs → production code (Run #${{ github.run_number }})"
          body: |
            ## 🤖 Automated Stub Rewrite — Orchestrator Pro

            Generated by **AWS Transform Custom**. Review before merging.

            ### ✅ Changes Made
            - `onMenuClick` navigation drawer implemented
            - `MonitorScreen.kt` created (was missing)
            - `retryJob()` exponential backoff added
            - `RealWebExecutor` OkHttp3 production HTTP
            - Playwright stubs removed, replaced with Kotlin parsing
            - Discord webhook hardened with silent failure handling
            - URI auto-fill with Luhn card validation

            ### 👀 Review Checklist
            - [ ] Verify drawer behavior matches UX intent
            - [ ] Test retryJob() with a failing job
            - [ ] Confirm OkHttp3 portal endpoints are correct
            - [ ] Validate Luhn check on card numbers
            - [ ] Run instrumented tests on device/emulator

            ---
            🔗 [Monitor in AWS Transform Console](https://7223606c1e23777de.transform.us-east-1.on.aws/signin/)
          labels: |
            aws-transform
            automated
            stub-rewrite
