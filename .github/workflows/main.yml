name: AWS Deploy & Code Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Configure AWS & Verify Identity
  # ─────────────────────────────────────────
  configure-aws:
    name: Configure AWS Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          aws-region: us-east-2
          audience: sts.amazonaws.com
          role-session-name: GitHubActions
          http-proxy: ""
          retry-max-attempts: 3

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

  # ─────────────────────────────────────────
  # JOB 2: CodeGuru Security Scan
  # ─────────────────────────────────────────
  codeguru-scan:
    name: CodeGuru Security & Quality Scan
    runs-on: ubuntu-latest
    needs: configure-aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-codeguru-role
          aws-region: us-east-2
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsCodeGuru
          http-proxy: ""
          retry-max-attempts: 3

      - name: Amazon CodeGuru Reviewer
        uses: aws-actions/codeguru-reviewer@v1.1
        with:
          s3_bucket: codeguru-reviewer-228060739480-us-east-2

      - name: Upload CodeGuru Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: codeguru-results.sarif.json

  # ─────────────────────────────────────────
  # JOB 3: Deploy App to S3
  # ─────────────────────────────────────────
  deploy:
    name: Deploy App to S3
    runs-on: ubuntu-latest
    needs: codeguru-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          aws-region: us-east-2
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsDeploy
          http-proxy: ""
          retry-max-attempts: 3

      - name: Sync app folder to S3
        run: |
          aws s3 sync ./app s3://app1939484/ \
            --delete \
            --region us-east-2

      - name: Verify S3 Deployment
        run: |
          echo "✅ Deployment complete. Files in S3 bucket:"
          aws s3 ls s3://app1939484/ --recursive --human-readable

  # ─────────────────────────────────────────
  # JOB 4: Deploy CloudFormation Stack
  # ─────────────────────────────────────────
  cloudformation-deploy:
    name: Deploy CloudFormation Stack
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228060739480:role/github-actions-role
          aws-region: us-east-2
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsCloudFormation
          http-proxy: ""
          retry-max-attempts: 3

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name app-stack \
            --template-file cloudformation/template.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-east-2 \
            --no-fail-on-empty-changeset

      - name: Verify Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name app-stack \
            --region us-east-2 \
            --query "Stacks[0].StackStatus"
